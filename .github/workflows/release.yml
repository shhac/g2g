# Release on a v* tag push: the shared workflow cross-builds, publishes the
# GitHub Release, and regenerates + pushes the Homebrew formula. To release:
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# The shared go-release workflow builds and publishes but does not test, so the
# verify job below gates it. A tag whose tree fails gofmt, vet, or the suite
# publishes nothing.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Format, vet, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "These files need gofmt -w:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  release:
    needs: verify
    uses: shhac/homebrew-tap/.github/workflows/go-release.yml@main
    permissions:
      contents: write
    secrets: inherit
    with:
      # The command, module, asset, formula and repository are all g2g now, so
      # cmd_path and installed_binary_name are left at their defaults
      # (./cmd/<name> and <name>). The tap carries formula_renames.json mapping
      # gt2gh to g2g, which is what migrates installs made under the old name.
      name: g2g
      desc: "Manage stacked branches and project them onto GitHub native stacks"
      formula_class: G2g
      # help_match is asserted by the generated formula's brew test against the
      # installed binary's --help, so it has to track the command's own wording.
      # Changing a command description without this publishes a formula whose
      # test fails.
      help_match: "Link a stack to GitHub"
